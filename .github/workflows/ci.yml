name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Actions still on Node 20 emit a deprecation warning; run them on Node 24 now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python scripts/check_deps.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Determinism: the pinned vectors must come out identical on every OS (Blueprint §18.3).
      - run: cargo run -q -p pg-cli -- selftest
      # The shipped base content pack must load, validate and resolve on every OS.
      - run: cargo run -q -p pg-cli -- content lint
      # Golden replay: the recorded day hashes must reproduce on every OS, and a mid-run
      # snapshot/resume must match the uninterrupted run (Blueprint §18.3).
      - run: cargo run -q -p pg-cli -- replay golden/dev-town-3days.json --snapshot-at 12345
      # The action registry and schedule explainer must run (0.5).
      - run: cargo run -q -p pg-cli -- actions
      - run: cargo run -q -p pg-cli -- schedule explain pawn_1 --seed town --dev-map 48x36 --dev-pawns 4 --at 9000
      # Persistence (0.6): save, verify, scenario, bug bundle.
      - run: cargo run -q -p pg-cli -- save create target/ci-saves --world town --seed ci --dev-map 40x30 --dev-pawns 6 --days 2 --content data/base
      - run: cargo run -q -p pg-cli -- save verify target/ci-saves town --content data/base
      - run: cargo run -q -p pg-cli -- scenario run scenarios/persistence.json
      - run: cargo run -q -p pg-cli -- bugbundle create golden/dev-town-3days.json --at 20000 --out target/ci.pgbundle
      - run: cargo run -q -p pg-cli -- bugbundle run target/ci.pgbundle
      # AI client skeleton (0.7): redaction self-check with a sentinel key, and the exact request is printable.
      - run: cargo run -q -p pg-cli -- ai selfcheck
      - run: cargo run -q -p pg-cli -- ai test --provider anthropic --dry-run
      - run: cargo run -q -p pg-cli -- ai test --provider player2 --dry-run
      # Scripting (0.9): cookbook packs must reproduce their golden hashes on every OS, including with every VM
      # rebuilt at each day boundary; the API reference and editor definitions must generate.
      - run: cargo run -q -p pg-cli -- pack lint packs/cookbook/caffeine
      - run: cargo run -q -p pg-cli -- pack test packs/cookbook/caffeine
      - run: cargo run -q -p pg-cli -- pack test packs/cookbook/evening_legs
      - run: cargo run -q -p pg-cli -- pack test packs/cookbook/birthdays
      - run: cargo run -q -p pg-cli -- pack docs --luau
      - run: cargo run -q -p pg-cli -- content schema templates
      # Stage 0 gate scenarios (0.11): the sample town, a migrated fixture and a world with script packs, each
      # pinned to a final state hash that must be the same on every OS.
      - run: cargo run -q -p pg-cli -- scenario run scenarios/gate-stage0-town.json scenarios/gate-stage0-migrate.json scenarios/gate-stage0-scripts.json
      # The app (0.10): a scripted session through every menu and an in-game run, with the real UI code under a
      # headless egui context. The window itself is not opened in CI.
      - run: cargo run -q -p pg-app -- --smoke
      # Everything above in one report, as a person would run it.
      - run: cargo run -q -p pg-cli -- check
      # Parallel pathfinding must give results identical to serial on every OS (Blueprint §7.3, §19).
      - run: cargo run -q -p pg-cli -- map bench-paths --size 96x72 --requests 300 --threads 1,2,4

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  soak:
    name: 30-day soak (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 30 game days with script packs loaded; every day re-simulated on another thread count (shadow
      # verification); bounded state and script cost; the final hash is pinned and must match on every OS.
      - run: cargo run --release -q -p pg-cli -- scenario run scenarios/soak-30-days.json
