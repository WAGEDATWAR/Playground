name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Actions still on Node 20 emit a deprecation warning; run them on Node 24 now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python scripts/check_deps.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Determinism: the pinned vectors must come out identical on every OS (Blueprint §18.3).
      - run: cargo run -q -p pg-cli -- selftest

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
