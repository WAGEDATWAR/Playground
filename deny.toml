# cargo-deny policy (Blueprint §18, §21, §24). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. Add to this list deliberately (see docs/DECISIONS.md) when a new
# dependency needs another one; copyleft requires an explicit decision first.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",   # webpki-roots, the Mozilla CA bundle used by TLS (D-026); permissive, attribution only
]
confidence-threshold = 0.9

# Our own crates are `publish = false` with a placeholder license (D-002); only third-party
# dependencies are checked until a project license is chosen.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies carry no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
