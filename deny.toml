# cargo-deny policy (Blueprint §18, §21, §24). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained; reached only through winit's Wayland title-bar drawing on Linux. Revisit when winit moves on (D-030).
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# Permissive licenses only. Add to this list deliberately (see docs/DECISIONS.md) when a new
# dependency needs another one; copyleft requires an explicit decision first.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",               # Boost license, permissive; pulled in by the GPU/windowing stack (D-030)
    "CDLA-Permissive-2.0",   # webpki-roots, the Mozilla CA bundle used by TLS (D-026); permissive, attribution only
]
confidence-threshold = 0.9

# The fonts bundled with egui (OFL / Ubuntu Font Licence) are fonts, not code: free to ship with attribution (D-030).
exceptions = [
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

# Our own crates are `publish = false` (MIT, D-047); only third-party
# dependencies are checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies carry no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
